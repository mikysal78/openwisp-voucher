name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q

  # l'eseguibile Windows si compila e porta nome e versione nelle proprietà
  # (SignPath li controlla prima di firmare)
  windows-executable:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Executable
        run: packaging/build.sh
      - name: Version metadata
        shell: pwsh
        run: |
          $info = (Get-Item dist/openwisp-voucher.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersion
          $version = (Select-String -Path openwisp_voucher/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($info.ProductName -ne 'openwisp-voucher' -or $info.ProductVersion -ne $version) {
            throw "Unexpected metadata: $($info.ProductName) $($info.ProductVersion)"
          }
