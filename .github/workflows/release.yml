name: Release

# Al push di un tag v* (es. v0.2.0): test, eseguibile per Windows e per Linux
# con PyInstaller, SHA256SUMS, attestazione di provenienza e release su GitHub
# con le note del CHANGELOG.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          # glibc vecchia: l'eseguibile parte anche su distribuzioni meno recenti
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Version matches the tag
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' openwisp_voucher/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "::error::__version__ $version does not match tag $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install
        run: python -m pip install -e ".[test,build]"
      - name: Tests
        run: python -m pytest -q
      - name: Executable
        run: packaging/build.sh

      - name: Collect
        run: |
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/openwisp-voucher.exe "out/openwisp-voucher-$VERSION-windows.exe"
          else
            tar -C dist -czf "out/openwisp-voucher-$VERSION-linux-x86_64.tar.gz" openwisp-voucher
          fi
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/openwisp-voucher-*
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          **Windows**: \`openwisp-voucher-$VERSION-windows.exe\` (not code-signed: SmartScreen may ask to confirm, "More info" → "Run anyway").
          **Linux** (x86_64): extract \`openwisp-voucher-$VERSION-linux-x86_64.tar.gz\` and run \`./openwisp-voucher\`; on Debian/Ubuntu Qt also needs \`libxcb-cursor0\`.
          Checksums in \`SHA256SUMS\`, build provenance attested by GitHub
          (\`gh attestation verify <file> -R $GITHUB_REPOSITORY\`).
          NOTES
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "openwisp-voucher $VERSION" \
            --notes-file notes.md dist/*
